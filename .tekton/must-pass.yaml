---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: must-pass
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: git-clone
              image: alpine/git:latest
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -e
                git clone $(params.repo_url) .
                git checkout $(params.revision)
        workspaces:
          - name: source
            workspace: source
      
      - name: build-and-test
        runAfter:
          - fetch-repository
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: build
              image: golang:1.21
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/bash
                set -e
                make build
            
            - name: test
              image: golang:1.21
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/bash
                set -e
                make test
        workspaces:
          - name: source
            workspace: source
  
  workspaces:
    - name: source
      emptyDir: {}
